{% extends 'base.html' %}
{% block title %}{{ 'Edit' if quiz else 'New' }} Quiz{% endblock %}

{% block content %}
<div class="panel form-panel">
  <h2 class="h4 mb-3">{{ 'Edit Quiz' if quiz else 'New Quiz' }}</h2>
  <form method="post">
    <div class="mb-3">
      <label for="quizName" class="form-label">Quiz name</label>
      <input type="text" class="form-control" id="quizName" name="quiz_name"
        value="{{ values.quiz_name }}" maxlength="100" required autofocus>
    </div>
    <div class="mb-3">
      <label for="quizChapter" class="form-label">Chapter</label>
      <select class="form-select" id="quizChapter" name="chapter_id" required>
        <option value="">Choose a chapter...</option>
        {% for subject in subjects if subject.chapters %}
        <optgroup label="{{ subject.subject_name }}">
          {% for chapter in subject.chapters %}
          <option value="{{ chapter.id }}" {% if chapter.id == values.chapter_id %}selected{% endif %}>{{ chapter.chapter_name }}</option>
          {% endfor %}
        </optgroup>
        {% endfor %}
      </select>
    </div>
    <div class="row">
      <div class="col-sm-6 mb-3">
        <label for="quizDate" class="form-label">Date of quiz</label>
        <input type="date" class="form-control" id="quizDate" name="date_of_quiz" value="{{ values.date_of_quiz }}" required>
        <div class="form-text">Users can attempt the quiz from this date.</div>
      </div>
      <div class="col-sm-6 mb-3">
        <label for="quizDuration" class="form-label">Duration (HH:MM)</label>
        <input type="text" class="form-control" id="quizDuration" name="time_duration" value="{{ values.time_duration }}"
          placeholder="00:30" pattern="\d{1,2}:[0-5]\d" title="Hours and minutes, e.g. 00:30" required>
      </div>
    </div>
    <div class="mb-3">
      <label for="quizRemarks" class="form-label">Remarks <span class="text-muted">(optional)</span></label>
      <textarea class="form-control" id="quizRemarks" name="remarks" rows="2" maxlength="200">{{ values.remarks }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('admin_quizzes') }}">Cancel</a>
  </form>
</div>
{% endblock %}
